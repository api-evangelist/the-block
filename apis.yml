aid: the-block
name: The Block
description: >-
  The Block is a New York-based digital-assets research, analysis, and news
  brand founded in 2018, covering cryptocurrency, blockchain, and Web3 markets.
  Its subscription platform, The Block Pro, packages breaking news, in-depth
  research, proprietary datasets, and venture-funding intelligence for
  professional investors, funds, and enterprises. The Block Pro also exposes a
  set of license-gated APIs - a real-time News API (REST, request-only, JSON),
  a Deals/Funding API, an Ecosystems/Data API, and a WebSocket news stream -
  available only to organizations holding a Block Pro subscription. The APIs
  have no public developer portal or OpenAPI definition; access and technical
  documentation are arranged through The Block's client-services team.
