apis:
  - aid: the-block-news-api
    name: The Block News API
    description: >-
      Request-only REST API for searching and retrieving current and historical
      crypto news coverage from The Block, returned as JSON filtered by keyword,
      topic, article length, and publication date (up to 1,000 articles per
      query). Licensed to Block Pro subscribers; no public OpenAPI is published.
    humanURL: https://www.theblock.co/post/232778/the-block-unveils-real-time-news-api-for-seamless-integration-of-its-sector-specific-coverage-of-crypto-and-digital-assets
    tags:
      - News
      - Cryptocurrency
      - Digital Assets
  - aid: the-block-deals-api
    name: The Block Deals / Funding API
    description: >-
      Access to The Block's web3 fundraising and deals database - company and
      investor profiles and deal-level funding data. Licensed to Block Pro
      subscribers; no public OpenAPI is published.
    humanURL: https://www.theblock.pro/
    tags:
      - Venture Capital
      - Funding
      - Web3
  - aid: the-block-ecosystems-api
    name: The Block Ecosystems / Data API
    description: >-
      Programmatic access to The Block's library of proprietary blockchain and
      ecosystem datasets and charts. Licensed to Block Pro subscribers; no public
      OpenAPI is published.
    humanURL: https://www.theblock.pro/
    tags:
      - Market Data
      - Blockchain
      - Data
